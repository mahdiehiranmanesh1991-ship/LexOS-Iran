# Publishes the static UI preview (preview-static/) to GitHub Pages.
# The interactive app deploys to Vercel; this is the zero-backend visual tour.
name: Deploy UI preview to Pages

on:
  push:
    branches: ["claude/keen-thompson-5wocfs"]
    paths:
      - "preview-static/**"
      - ".github/workflows/deploy-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview-static
      - id: deployment
        uses: actions/deploy-pages@v4
